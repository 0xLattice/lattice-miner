[package]
name = "lattice-miner"
version = "0.1.0"
edition = "2024"
description = "Lattice mining coordinator: templates, nonce ranges, workers and submission against a node"
license = "MIT"
repository = "https://github.com/0xLattice/lattice-miner"
publish = false

[[bin]]
name = "lattice-miner"
path = "src/main.rs"

[dependencies]
lattice-primitives = { git = "https://github.com/0xLattice/lattice-rs", rev = "f3501af56b4dc731bc5f8a494f5be5f91ee7d583" }
lattice-pow = { git = "https://github.com/0xLattice/lattice-rs", rev = "f3501af56b4dc731bc5f8a494f5be5f91ee7d583" }
lattice-cashew = { git = "https://github.com/0xLattice/cashew-rs", rev = "ba341b7af36e5769d4423cd486ae8f2ac81f9f0c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
sha2 = "0.10"
num-bigint = "0.4"
base64 = "0.22"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs", "signal", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
url = "2"
clap = { version = "4", features = ["derive"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.30", features = ["signal", "process"] }

[dev-dependencies]
tempfile = "3"
